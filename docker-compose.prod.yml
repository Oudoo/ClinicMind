# Production stack: Caddy (automatic HTTPS, on-demand certificates for tenant
# subdomains and custom domains) → app, Postgres with a named volume, one-shot
# migrations, nightly backups, optional demo seed. See docs/RUNBOOK.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d          # pulls the published images
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build  # or builds them here
#   docker compose -f docker-compose.prod.yml --env-file .env --profile seed run --rm seed
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. app.clinic.example)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clinicmind
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicmind -d clinicmind"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Not published: only reachable from the other services on this network.

  migrate:
    image: ${CLINICMIND_TOOLS_IMAGE:-ghcr.io/oudoo/clinicmind-tools:latest}
    build:
      context: .
      target: tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD}@db:5432/clinicmind?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    image: ${CLINICMIND_IMAGE:-ghcr.io/oudoo/clinicmind:latest}
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_URL: https://${DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-${DOMAIN}}
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD}@db:5432/clinicmind?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
      EMBED_SIGNING_SECRET: ${EMBED_SIGNING_SECRET:?set EMBED_SIGNING_SECRET (openssl rand -base64 48)}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-auto}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Not published: Caddy is the only entry point.

  # Demo clinic (six accounts, seeded data, assistant index). Rebuilds the demo
  # tenant from scratch each time: `--profile seed run --rm seed`.
  seed:
    profiles: ["seed"]
    image: ${CLINICMIND_TOOLS_IMAGE:-ghcr.io/oudoo/clinicmind-tools:latest}
    build:
      context: .
      target: tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: https://${DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-${DOMAIN}}
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD}@db:5432/clinicmind?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
      EMBED_SIGNING_SECRET: ${EMBED_SIGNING_SECRET:?set EMBED_SIGNING_SECRET (openssl rand -base64 48)}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-auto}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    command: ["npx", "tsx", "prisma/seed.ts"]

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # After each dump, restore it into a scratch database and check it row for
      # row against the dump's manifest (scripts/restore-drill.sh). "off" skips it.
      RESTORE_DRILL: ${RESTORE_DRILL:-on}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/clinicmind-backup:ro
      - ./scripts/restore-drill.sh:/usr/local/bin/clinicmind-restore-drill:ro
    entrypoint: ["/bin/sh", "-c"]
    # Nightly at 02:00 (container clock, UTC): a compressed custom-format dump with
    # its manifest and checksum, then the restore drill. Results: /backups/restore-drill.log.
    command: ["while true; do sleep $$((($$(date -d 'tomorrow 02:00' +%s) - $$(date +%s)))); if clinicmind-backup && { [ \"$$RESTORE_DRILL\" = off ] || clinicmind-restore-drill; }; then echo 'backup and restore drill OK'; else echo 'BACKUP OR RESTORE DRILL FAILED: see /backups/restore-drill.log'; fi; done"]

volumes:
  pg_data:
  caddy_data:
  caddy_config:
