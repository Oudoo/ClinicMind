name: Hostinger

# Does what deploy/hostinger/request.json asks on the Hostinger account in the
# HOSTINGER_API_TOKEN repository secret, through Hostinger's API server: see
# scripts/hostinger-api.mjs and docs/HOSTINGER.md. A push to main that changes
# the request file starts it, so it runs whichever branch is the repository's
# default; "Run workflow" works too once main is the default branch.
#
# Secrets: HOSTINGER_API_TOKEN; for "deploy" also DEMO_DATABASE_URL (PostgreSQL
# outside Hostinger), and optionally GEMINI_API_KEY and SEED_DEMO_PASSWORD.
on:
  push:
    branches: [main]
    paths: [deploy/hostinger/request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the request
        id: request
        run: |
          action=$(jq -r .action deploy/hostinger/request.json)
          domain=$(jq -r '.domain // empty' deploy/hostinger/request.json)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          if [ -n "$domain" ] && { [ "$action" = deploy ] || [ "$action" = status ]; }; then echo "live=true" >> "$GITHUB_OUTPUT"; fi

      - name: Bundle the app (deploy only)
        if: steps.request.outputs.action == 'deploy'
        run: bash scripts/hostinger-package.sh

      - name: Run the request
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: node scripts/hostinger-api.mjs deploy/hostinger/request.json

      # The end-to-end suite against the live site (read only, apart from one
      # question to the assistant): every account's pages, sign-in and out, a
      # patient's account, the phone layout. Its traces stay on the runner: they
      # hold the demo accounts' session cookies, and this repository is public.
      - name: Check the live site
        if: steps.request.outputs.live == 'true'
        env:
          E2E_BASE_URL: https://${{ steps.request.outputs.domain }}
          E2E_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD || 'Demo-Clinic-2026!' }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
