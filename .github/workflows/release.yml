name: Release image

# Builds the production images once CI is green on main and publishes them to
# GitHub Container Registry, so a server deploys by pulling instead of building:
#   ghcr.io/<owner>/clinicmind:<sha|latest>        the web server
#   ghcr.io/<owner>/clinicmind-tools:<sha|latest>  migrations, seed, bootstrap
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names (registry paths must be lowercase)
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "web=ghcr.io/${owner}/clinicmind" >> "$GITHUB_OUTPUT"
          echo "tools=ghcr.io/${owner}/clinicmind-tools" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:latest
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ steps.names.outputs.tools }}:latest
            ${{ steps.names.outputs.tools }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
