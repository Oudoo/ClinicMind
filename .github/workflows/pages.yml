name: Deploy demo to GitHub Pages

# Publishes the static client-side demo in /demo to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

# GitHub Pages is enabled with Source = "GitHub Actions". This deploys the
# click-through prototype in /demo (a static, browser-only build with seeded
# data: every button and form responds, nothing leaves the browser). It is the
# Phase 1 tester build, not the application. Runs only from main; use
# "Run workflow" to redeploy.
on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site via the API (uses pages: write permission),
          # so no manual Settings → Pages step is required.
          enablement: true
      - name: Stamp asset URLs with the commit (cache busting)
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/[A-Za-z0-9_./-]+\.(js|css))#\1?v=${v}#g" demo/index.html
          grep -c "?v=${v}" demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo
      - id: deployment
        uses: actions/deploy-pages@v4
