name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs and collapse the duplicate push+PR runs for a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinicmind
          POSTGRES_PASSWORD: clinicmind
          POSTGRES_DB: clinicmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicmind -d clinicmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinicmind:clinicmind@localhost:5432/clinicmind_test?schema=public
      AUTH_SECRET: ci-auth-secret-ci-auth-secret
      EMBED_SIGNING_SECRET: ci-embed-secret-ci-embed-secret
      AI_DEFAULT_PROVIDER: echo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prisma generate
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      # The migrations create the application role without a password; the
      # tests connect as it, so row-level security binds them as in production.
      - name: Let the application role sign in
        env:
          APP_DB_PASSWORD: ci-app-role-0123456789abcdef
        run: npx tsx scripts/db-app-role.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (as the application role, row-level security enforced)
        env:
          TEST_DATABASE_URL: postgresql://clinicmind_app:ci-app-role-0123456789abcdef@localhost:5432/clinicmind_test?schema=public
          TEST_SYSTEM_DATABASE_URL: postgresql://clinicmind:clinicmind@localhost:5432/clinicmind_test?schema=public
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinicmind
          POSTGRES_PASSWORD: clinicmind
          POSTGRES_DB: clinicmind_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicmind -d clinicmind_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinicmind:clinicmind@localhost:5432/clinicmind_e2e?schema=public
      AUTH_SECRET: ci-e2e-auth-secret-0123456789abcdefghijklmnopqrstuvwxyz
      EMBED_SIGNING_SECRET: ci-e2e-embed-secret-0123456789abcdefghijklmnopqrstuvwxyz
      APP_URL: http://localhost:3000
      AI_DEFAULT_PROVIDER: echo
      SEED_DEMO_PASSWORD: Demo-Clinic-2026!
      E2E_PASSWORD: Demo-Clinic-2026!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Let the application role sign in
        env:
          APP_DB_PASSWORD: ci-e2e-app-role-0123456789abcdef
        run: npx tsx scripts/db-app-role.ts
      - run: npm run db:seed
      - name: Check the seeded demo (plausible clinical data, every account adding up)
        run: npx vitest run src/__tests__/seed.consistency.test.ts
      - name: Rehearse a backup and restore of the seeded database
        env:
          PGHOST: localhost
          PGUSER: clinicmind
          PGPASSWORD: clinicmind
          PGDATABASE: clinicmind_e2e
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          pg_dump --version
          bash scripts/backup.sh
          bash scripts/restore-drill.sh
      - run: npm run build
      - name: Start production server (as the application role)
        env:
          DATABASE_URL: postgresql://clinicmind_app:ci-e2e-app-role-0123456789abcdef@localhost:5432/clinicmind_e2e?schema=public
          SYSTEM_DATABASE_URL: postgresql://clinicmind:clinicmind@localhost:5432/clinicmind_e2e?schema=public
        run: |
          cp -r public .next/standalone/ && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/
          NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do sleep 1; curl -sf http://localhost:3000/api/health && break; done
          echo
          curl -sf http://localhost:3000/api/health | grep -q '"rowLevelSecurity":"enforced"' \
            || { echo "row-level security is not enforced on the app's connection"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            server.log
          retention-days: 7
