name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinicmind
          POSTGRES_PASSWORD: clinicmind
          POSTGRES_DB: clinicmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinicmind:clinicmind@localhost:5432/clinicmind_test?schema=public
      AUTH_SECRET: ci-auth-secret-ci-auth-secret
      EMBED_SIGNING_SECRET: ci-embed-secret-ci-embed-secret
      AI_DEFAULT_PROVIDER: echo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema
        run: npx prisma db push --skip-generate

      - name: Apply pgvector + RLS
        run: psql "$DATABASE_URL" -f prisma/sql/01_pgvector_and_rls.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
