services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clinicmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicmind}
      POSTGRES_DB: clinicmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.docker-data/redis:/data

  # S3-compatible object storage for audio / documents / images.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinicmind
      MINIO_ROOT_PASSWORD: clinicmind-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./.docker-data/minio:/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      ROOT_DOMAIN: lvh.me:3000
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD:-clinicmind}@db:5432/clinicmind?schema=public
      REDIS_URL: redis://redis:6379
      # Required: the app refuses to start with missing or placeholder secrets.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      EMBED_SIGNING_SECRET: ${EMBED_SIGNING_SECRET:?set EMBED_SIGNING_SECRET in .env (openssl rand -base64 48)}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-auto}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: clinicmind
      S3_ACCESS_KEY_ID: clinicmind
      S3_SECRET_ACCESS_KEY: clinicmind-secret
    ports:
      - "3000:3000"
