# Local / demo stack: Postgres + pgvector, one-shot migrations, the app.
#
#   cp .env.example .env            # set AUTH_SECRET, EMBED_SIGNING_SECRET (+ an AI key)
#   docker compose up --build       # http://localhost:3000
#   docker compose --profile seed run --rm seed   # demo clinic + printed password
#
# Production: see docker-compose.prod.yml and docs/RUNBOOK.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clinicmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicmind}
      POSTGRES_DB: clinicmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicmind -d clinicmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD:-clinicmind}@db:5432/clinicmind?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: tools
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD:-clinicmind}@db:5432/clinicmind?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      EMBED_SIGNING_SECRET: ${EMBED_SIGNING_SECRET:?set EMBED_SIGNING_SECRET in .env (openssl rand -base64 48)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    command: ["npx", "tsx", "prisma/seed.ts"]

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost:3000}
      DATABASE_URL: postgresql://clinicmind:${POSTGRES_PASSWORD:-clinicmind}@db:5432/clinicmind?schema=public
      # Required: the app refuses to start with missing or placeholder secrets.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      EMBED_SIGNING_SECRET: ${EMBED_SIGNING_SECRET:?set EMBED_SIGNING_SECRET in .env (openssl rand -base64 48)}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-auto}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
